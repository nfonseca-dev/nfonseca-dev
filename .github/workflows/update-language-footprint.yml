name: Update practice evidence

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-language-footprint.mjs'
      - '.github/workflows/update-language-footprint.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-language-footprint.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: nfonseca-dev
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'chore: update practice evidence'
          file_pattern: assets/practice-evidence.svg
